name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
